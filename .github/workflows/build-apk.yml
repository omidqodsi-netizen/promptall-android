name: Build promptAll Market Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply Bazaar billing recovery fix (3.10.10)
        run: python3 apply_bazaar_fix.py

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PROMPTALL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/promptall-release.p12"

      - name: Build signed release APK and AAB
        env:
          PROMPTALL_KEYSTORE: ${{ runner.temp }}/promptall-release.p12
          PROMPTALL_STORE_PASSWORD: ${{ secrets.PROMPTALL_STORE_PASSWORD }}
          PROMPTALL_KEY_ALIAS: ${{ secrets.PROMPTALL_KEY_ALIAS }}
          PROMPTALL_KEY_PASSWORD: ${{ secrets.PROMPTALL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Collect output
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/promptAll-v${VERSION}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/promptAll-v${VERSION}-release.aab"
          cp app/build/outputs/mapping/release/mapping.txt "release/mapping-v${VERSION}.txt"

      - name: Upload market release
        uses: actions/upload-artifact@v4
        with:
          name: promptAll-market-release
          path: release/
          if-no-files-found: error
          retention-days: 90
